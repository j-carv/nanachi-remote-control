<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Loaded with loadFile: nothing remote, no network from the page (everything goes through window.nanachiControl).
         base-uri, form-action and object-src are not covered by default-src, so they are closed on their own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Nanachi</title>
    <link rel="icon" type="image/png" href="./icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
